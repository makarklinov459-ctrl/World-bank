<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Копилка Английских Слов</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">
  <style>
    @import url('https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&display=swap');
    body { font-family: 'Inter', sans-serif; }
    .card { transition: all 0.3s ease; }
    .side-panel { transform: translateX(100%); transition: transform 0.3s ease; }
    .side-panel.open { transform: translateX(0); }
    .dark body { background: #0f172a; color: #e2e8f0; }
    .dark .bg-white { background: #1e293b !important; }
    .dark .text-gray-800 { color: #f1f5f9 !important; }
    .dark .text-gray-600, .dark .text-gray-500, .dark .text-gray-700 { color: #94a3b8 !important; }
    .dark .border-gray-200, .dark .border-gray-300 { border-color: #334155 !important; }
    .dark .bg-indigo-50 { background: #1e1b4b !important; }
  </style>
</head>
<body class="bg-gradient-to-br from-indigo-50 via-white to-purple-50 min-h-screen">
  <button onclick="togglePanel()" class="fixed top-6 right-6 z-40 w-14 h-14 bg-indigo-600 text-white rounded-full shadow-lg flex items-center justify-center text-xl">
    <i class="fas fa-bars"></i>
  </button>

  <div id="side-panel" class="side-panel fixed top-0 right-0 h-full w-80 bg-white shadow-2xl z-50 p-6 overflow-y-auto border-l">
    <div class="flex justify-between items-center mb-6">
      <h2 class="text-xl font-bold">Настройки</h2>
      <button onclick="togglePanel()" class="text-2xl">&times;</button>
    </div>
    <div id="auth-logged-out">
      <h3 class="font-semibold mb-3">Аккаунт</h3>
      <input id="auth-login" placeholder="Логин" class="w-full px-3 py-2 border rounded-lg mb-2 text-sm">
      <input id="auth-password" type="password" placeholder="Пароль" class="w-full px-3 py-2 border rounded-lg mb-3 text-sm">
      <button onclick="handleAuth(false)" class="w-full bg-indigo-600 text-white py-2 rounded-lg text-sm mb-2">Войти</button>
      <button onclick="handleAuth(true)" class="w-full bg-gray-200 py-2 rounded-lg text-sm">Зарегистрироваться</button>
    </div>
    <div id="auth-logged-in" class="hidden">
      <p class="text-sm mb-3">Вошли как:<br><strong id="user-login"></strong></p>
      <button onclick="logout()" class="w-full bg-red-500 text-white py-2 rounded-lg text-sm">Выйти</button>
    </div>
    <div class="mt-8">
      <h3 class="font-semibold mb-3">Тема</h3>
      <div class="flex gap-2">
        <button onclick="setTheme('light')" class="flex-1 py-2 rounded-lg border text-sm">Светлая</button>
        <button onclick="setTheme('dark')" class="flex-1 py-2 rounded-lg border text-sm bg-gray-800 text-white">Тёмная</button>
      </div>
    </div>
  </div>

  <div class="max-w-5xl mx-auto px-4 py-8">
    <header class="text-center mb-10">
      <h1 class="text-4xl font-bold text-indigo-700 mb-2"><i class="fas fa-piggy-bank mr-3"></i>Копилка Слов</h1>
      <p class="text-gray-600">Добавляй слова → перевод → учись</p>
    </header>

    <div class="flex flex-wrap justify-center gap-2 mb-8">
      <button onclick="showTab('add')" class="tab-btn px-6 py-3 rounded-full font-medium bg-indigo-600 text-white">Добавить</button>
      <button onclick="showTab('bank')" class="tab-btn px-6 py-3 rounded-full font-medium bg-white border">Копилка <span id="word-count">0</span></button>
      <button onclick="showTab('learn')" class="tab-btn px-6 py-3 rounded-full font-medium bg-white border">Учить</button>
    </div>

    <div id="section-add" class="tab-section">
      <div class="bg-white rounded-2xl shadow-lg p-6 max-w-2xl mx-auto">
        <div class="flex gap-3">
          <input id="word-input" placeholder="Напиши слово (go, cry, run...)" class="flex-1 px-5 py-4 border rounded-xl text-lg">
          <button onclick="addWord()" id="add-btn" class="px-8 py-4 bg-indigo-600 text-white rounded-xl">Найти</button>
        </div>
        <div id="result" class="mt-6"></div>
      </div>
    </div>

    <div id="section-bank" class="tab-section hidden">
      <div class="bg-white rounded-2xl shadow-lg p-6">
        <div id="bank-list" class="space-y-3"></div>
        <div id="empty-bank" class="text-center py-16 text-gray-400 hidden">Копилка пуста</div>
      </div>
    </div>

    <div id="section-learn" class="tab-section hidden">
      <div class="bg-white rounded-2xl shadow-lg p-6 text-center" id="learn-content"></div>
    </div>
  </div>

  <script>
    const irregular = {
      go:["went","gone"], cry:["cried","cried"], run:["ran","run"], eat:["ate","eaten"],
      see:["saw","seen"], come:["came","come"], take:["took","taken"], make:["made","made"],
      get:["got","got"], know:["knew","known"], think:["thought","thought"], say:["said","said"],
      be:["was/were","been"], have:["had","had"], do:["did","done"], write:["wrote","written"]
    };

    let words = [];
    let currentUser = null;

    window.onload = () => {
      setTheme(localStorage.getItem('theme') || 'light');
      const u = localStorage.getItem('currentUser');
      if (u) { currentUser = u; updateAuth(); loadWords(); }
      updateCount();
    };

    function togglePanel(){ document.getElementById('side-panel').classList.toggle('open'); }
    function setTheme(t){
      document.body.classList.toggle('dark', t==='dark');
      localStorage.setItem('theme', t);
    }
    function getUsers(){ return JSON.parse(localStorage.getItem('users')||'{}'); }
    function saveUsers(u){ localStorage.setItem('users', JSON.stringify(u)); }

    function updateAuth(){
      document.getElementById('auth-logged-out').classList.toggle('hidden', !!currentUser);
      document.getElementById('auth-logged-in').classList.toggle('hidden', !currentUser);
      if(currentUser) document.getElementById('user-login').textContent = currentUser;
    }

    function handleAuth(reg){
      const login = document.getElementById('auth-login').value.trim().toLowerCase();
      const pass = document.getElementById('auth-password').value;
      if(!login || !pass) return alert('Заполни поля');
      const users = getUsers();
      if(reg){
        if(users[login]) return alert('Логин занят');
        users[login] = {pass, words:[]};
        saveUsers(users);
        currentUser = login;
      } else {
        if(!users[login] || users[login].pass !== pass) return alert('Неверно');
        currentUser = login;
        words = users[login].words || [];
      }
      localStorage.setItem('currentUser', currentUser);
      updateAuth(); updateCount(); togglePanel();
    }

    function logout(){
      currentUser = null;
      localStorage.removeItem('currentUser');
      words = [];
      updateAuth(); updateCount(); togglePanel();
    }

    function loadWords(){
      if(!currentUser) return;
      const users = getUsers();
      words = users[currentUser]?.words || [];
    }

    function saveWords(){
      if(!currentUser) return;
      const users = getUsers();
      users[currentUser].words = words;
      saveUsers(users);
    }

    function showTab(t){
      document.querySelectorAll('.tab-section').forEach(el=>el.classList.add('hidden'));
      document.getElementById('section-'+t).classList.remove('hidden');
      if(t==='bank') renderBank();
      if(t==='learn') startLearn();
    }

    function updateCount(){ document.getElementById('word-count').textContent = words.length; }

    async function addWord(){
      const word = document.getElementById('word-input').value.trim().toLowerCase();
      if(!word) return alert('Напиши слово');
      const result = document.getElementById('result');
      result.innerHTML = '<div class="text-center py-8">Загрузка...</div>';

      try {
        // Пробуем API
        const r = await fetch('https://api.dictionaryapi.dev/api/v2/entries/en/' + word);
        if(!r.ok) throw 0;
        const data = await r.json();
        const entry = data[0];
        let translation = word;
        try {
          const tr = await fetch('https://translate.googleapis.com/translate_a/single?client=gtx&sl=en&tl=ru&dt=t&q=' + encodeURIComponent(word));
          const td = await tr.json();
          translation = td[0][0][0];
        } catch(e){}

        const forms = irregular[word] ? {base:word, past:irregular[word][0], part:irregular[word][1]} : null;
        const obj = {id:Date.now(), word, translation, forms, added: new Date().toISOString()};
        if(words.find(w=>w.word===word)) return result.innerHTML = '<div class="text-yellow-600">Уже есть</div>';
        words.push(obj);
        if(currentUser) saveWords();
        updateCount();
        showResult(obj);
      } catch(e) {
        // Если API не работает — ручной ввод
        result.innerHTML = `
          <div class="bg-yellow-50 border border-yellow-200 p-4 rounded-xl">
            <p class="mb-3">API не отвечает. Добавь перевод вручную:</p>
            <input id="manual-trans" placeholder="Перевод на русский" class="w-full px-3 py-2 border rounded mb-3">
            <button onclick="saveManual('${word}')" class="w-full bg-indigo-600 text-white py-2 rounded">Сохранить</button>
          </div>`;
      }
    }

    function saveManual(word){
      const translation = document.getElementById('manual-trans').value.trim() || word;
      const forms = irregular[word] ? {base:word, past:irregular[word][0], part:irregular[word][1]} : null;
      const obj = {id:Date.now(), word, translation, forms, added: new Date().toISOString()};
      words.push(obj);
      if(currentUser) saveWords();
      updateCount();
      showResult(obj);
    }

    function showResult(w){
      let f = '';
      if(w.forms) f = `<div class="mt-3 text-sm text-indigo-700">${w.forms.base} / ${w.forms.past} / ${w.forms.part}</div>`;
      document.getElementById('result').innerHTML = `
        <div class="bg-indigo-50 p-5 rounded-xl">
          <div class="text-3xl font-bold">${w.word}</div>
          <div class="text-xl text-indigo-600 mt-1">${w.translation}</div>
          ${f}
          <div class="text-green-600 text-sm mt-2">Добавлено!</div>
        </div>`;
      document.getElementById('word-input').value = '';
    }

    function renderBank(){
      const list = document.getElementById('bank-list');
      const empty = document.getElementById('empty-bank');
      if(!words.length){ list.innerHTML=''; empty.classList.remove('hidden'); return; }
      empty.classList.add('hidden');
      list.innerHTML = words.map(w => `
        <div class="border p-4 rounded-xl flex justify-between">
          <div><b>${w.word}</b> — ${w.translation}</div>
          <button onclick="del(${w.id})" class="text-red-500">удалить</button>
        </div>`).join('');
    }

    function del(id){
      words = words.filter(w=>w.id!=id);
      if(currentUser) saveWords();
      updateCount(); renderBank();
    }

    function startLearn(){
      const c = document.getElementById('learn-content');
      if(!words.length) return c.innerHTML = 'Добавь слова сначала';
      let i = 0;
      function show(){
        const w = words[i % words.length];
        c.innerHTML = `
          <div class="text-4xl font-bold mb-4">${w.word}</div>
          <div class="text-2xl text-indigo-600 mb-6">${w.translation}</div>
          <button onclick="i++;show()" class="px-6 py-3 bg-indigo-600 text-white rounded-xl">Дальше</button>`;
      }
      show();
    }
  </script>
</body>
</html>
